<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sổ Tay Tài Liệu</title>
<meta name="description" content="Gom tài liệu hướng dẫn vào một chỗ, tìm nhanh, gửi PDF và video qua Zalo.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232457C5'/%3E%3Cpath d='M10 8h9a3 3 0 0 1 3 3v13h-9a3 3 0 0 1-3-3z' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Bố cục: menu trái + thanh trên (tìm kiếm, chuông, tên) + thẻ số liệu + biểu đồ + bảng có nhãn loại + chân trang mỏng */
:root{
  --bg:#EEF2F6; --surface:#FFFFFF; --ink:#16212E; --muted:#5B6B7D; --line:#DCE3EB; --soft:#F4F7FA;
  --accent:#2457C5; --accent-ink:#FFFFFF; --accent-soft:#E3ECFC;
  --side-bg:#13203A; --side-ink:#C9D4E6; --side-active:#22345C; --side-line:#26385E; --side-title:#FFFFFF;
  --new-bg:#E6EEF9; --new-fg:#2A4F94; --new-c:#5B8BD6;
  --doing-bg:#FFF1D6; --doing-fg:#8A5A00; --doing-c:#E0A100;
  --wait-bg:#EEE6FA; --wait-fg:#5B3AA3; --wait-c:#8E6CD9;
  --ok-bg:#DDF3E8; --ok-fg:#1B6B45; --ok-c:#2FA36B;
  --oth-bg:#E8EDF2; --oth-fg:#46586B; --oth-c:#8696A8;
  --bad:#B83232; --bad-bg:#FBE5E5; --scrim:rgba(14,21,34,.45);
  --font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1522; --surface:#161F2F; --ink:#E6ECF4; --muted:#93A3B8; --line:#26334A; --soft:#1B2639;
    --accent:#6C9BFF; --accent-ink:#0B1426; --accent-soft:#1E2E52;
    --side-bg:#0A101C; --side-ink:#AEBBD0; --side-active:#1B2B4B; --side-line:#18233A; --side-title:#F2F6FC;
    --new-bg:#1C2B49; --new-fg:#9DBBEF; --new-c:#6C9BFF;
    --doing-bg:#3A2D10; --doing-fg:#F2C45C; --doing-c:#E9B63A;
    --wait-bg:#2C2348; --wait-fg:#C3ABF3; --wait-c:#A58AE6;
    --ok-bg:#16352A; --ok-fg:#8DE0B5; --ok-c:#3FBF82;
    --oth-bg:#232E3E; --oth-fg:#B4C0CF; --oth-c:#7F90A5;
    --bad:#F07272; --bad-bg:#3A1C1F; --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
option{background:var(--surface);color:var(--ink)}
[hidden]{display:none!important}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.side{background:var(--side-bg);color:var(--side-ink);display:flex;flex-direction:column;gap:24px;padding-block:20px}
.brand{display:flex;align-items:center;gap:10px;color:var(--side-title);font-weight:700;font-size:16px;line-height:1.2}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.menu{display:flex;flex-direction:column;gap:4px}
.mi{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;background:none;border:0;color:inherit;text-align:left;font-weight:500;width:100%}
.mi:hover{background:var(--side-line)}
.mi[aria-current="page"]{background:var(--side-active);color:var(--side-title)}
.mi .cnt{margin-left:auto;font-size:12px;background:var(--side-line);color:var(--side-title);padding:1px 8px;border-radius:999px;font-variant-numeric:tabular-nums}
.side-note{margin-top:auto;border-top:1px solid var(--side-line);padding-top:16px;font-size:12.5px;line-height:1.5}
.side-note b{color:var(--side-title);display:block;margin-bottom:2px}

.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding-block:12px;background:var(--surface);border-bottom:1px solid var(--line)}
.search{position:relative;flex:1;max-width:460px;min-width:0}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{width:100%;min-width:0;padding:9px 12px 9px 38px;border:1px solid var(--line);border-radius:8px;background:var(--soft)}
.search input::placeholder{color:var(--muted)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.bellwrap{position:relative}
.iconbtn{position:relative;width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{background:var(--soft)}
.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;display:grid;place-items:center}
.pop{position:absolute;right:0;top:46px;width:min(320px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:8px;z-index:20}
.pop h3{font-size:13px;padding:6px 8px;color:var(--muted)}
.pop button{display:flex;width:100%;justify-content:space-between;gap:10px;text-align:left;padding:8px;border:0;background:none;border-radius:6px}
.pop button:hover{background:var(--soft)}
.pop .empty{padding:8px;color:var(--muted)}
button.user{background:none;cursor:pointer;font:inherit;color:inherit}
button.user:hover{background:var(--soft)}
.user{display:flex;align-items:center;gap:8px;padding:3px 10px 3px 3px;border:1px solid var(--line);border-radius:999px;font-weight:600;white-space:nowrap}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700}

.content{padding-block:22px;display:flex;flex-direction:column;gap:16px;flex:1}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.head h1{font-size:22px;line-height:1.25}
.head p{margin:2px 0 0;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.6;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--soft);filter:none}
.btn.sm{padding:5px 10px;font-size:13px}
.notice{padding:10px 14px;border-radius:8px;background:var(--accent-soft);color:var(--ink);display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.notice.bad{background:var(--bad-bg);color:var(--bad)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.stat .lab{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:500}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.stat .num{font-size:32px;font-weight:700;line-height:1.2;margin-top:6px;font-variant-numeric:tabular-nums}
.stat .sub{color:var(--muted);font-size:12.5px}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.card h2{font-size:15px;margin-bottom:12px}
.card .hrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.card .hrow h2{margin:0}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600}
.link:hover{text-decoration:underline}
.donutrow{display:flex;flex-wrap:wrap;align-items:center;gap:16px 24px}
.donut{width:150px;height:150px;flex:none}
.donut .ring{stroke:var(--line)}
.donut .seg.c-new{stroke:var(--new-c)}.donut .seg.c-doing{stroke:var(--doing-c)}.donut .seg.c-wait{stroke:var(--wait-c)}.donut .seg.c-ok{stroke:var(--ok-c)}.donut .seg.c-oth{stroke:var(--oth-c)}
.donut .big{font-size:24px;font-weight:700;fill:var(--ink);text-anchor:middle}
.donut .small{font-size:9px;fill:var(--muted);text-anchor:middle}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;flex:1;min-width:150px}
.legend li{display:flex;align-items:center;gap:8px}
.legend .n{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.tagbars{display:flex;flex-direction:column;gap:8px}
.tb{position:relative;display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.tb:hover{border-color:var(--accent)}
.tb i{position:absolute;top:0;bottom:0;left:0;background:var(--accent-soft)}
.tb span{position:relative}
.tb .n{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:10px}
.thumb{border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--surface);text-align:center}
.thumb img{width:100%;height:84px;object-fit:cover;border-radius:6px;display:block}
.thumb .tb{display:flex;gap:4px;justify-content:center;margin-top:6px}
.thumb button{border:1px solid var(--line);background:var(--surface);border-radius:6px;min-width:30px;height:30px;font-size:14px;cursor:pointer;color:inherit}
.thumb .no{font-size:12px;color:var(--muted);margin-top:4px}
.cap{color:var(--muted);font-size:12.5px;margin-top:8px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.chip:hover{background:var(--soft)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .c{opacity:.75;margin-left:4px;font-variant-numeric:tabular-nums}

.tablewrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--soft)}
.tbl.wide{min-width:700px}
.tbl.mid{min-width:520px}
.strong{font-weight:600}
.acts{white-space:nowrap;text-align:right}
.acts button{background:none;border:0;padding:4px 8px;border-radius:6px;color:var(--accent);font-weight:600}
.acts button:hover{background:var(--soft)}
.acts button.danger{color:var(--bad)}
.acts button.sure{background:var(--bad);color:#fff}
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.lt-new{background:var(--new-bg);color:var(--new-fg)}.lt-doing{background:var(--doing-bg);color:var(--doing-fg)}.lt-wait{background:var(--wait-bg);color:var(--wait-fg)}.lt-ok{background:var(--ok-bg);color:var(--ok-fg)}.lt-oth{background:var(--oth-bg);color:var(--oth-fg)}
.tag{display:inline-block;margin:2px 4px 0 0;padding:1px 8px;border-radius:6px;border:1px solid var(--line);background:var(--soft);font-size:12px;color:var(--muted)}
button.tag:hover{border-color:var(--accent);color:var(--accent)}
.ex{display:inline-block;margin-left:6px;padding:0 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:600;vertical-align:1px}
.empty-st{padding:28px 12px;text-align:center;color:var(--muted)}
.empty-st b{display:block;color:var(--ink);margin-bottom:4px}
a{color:var(--accent);font-weight:600;text-decoration:none}
a:hover{text-decoration:underline}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.fc{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border:0;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:600;max-width:100%;overflow-wrap:anywhere;text-align:left}
.fc:hover{filter:brightness(.95)}
.fc.go{background:var(--accent);color:var(--accent-ink)}
.fc:disabled{opacity:.6;cursor:default}
.vid{width:100%;max-height:70vh;background:#000;border-radius:8px}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.dlg{position:fixed;z-index:41;left:50%;top:max(16px,env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(520px,calc(100vw - 32px));max-height:calc(100% - 32px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px}
.dlg h2{font-size:18px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-weight:600;font-size:13px}
.fld small{color:var(--muted)}
.inp{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
textarea.inp{min-height:76px;resize:vertical}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.err{color:var(--bad);font-size:13px;min-height:1px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:60;max-width:calc(100vw - 32px);text-align:center}

.foot{padding-block:10px;padding-bottom:max(10px,env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:12.5px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{flex-direction:row;align-items:center;gap:12px;padding-block:10px;padding-top:max(10px,env(safe-area-inset-top,0px));overflow-x:auto}
  .brand span.bt{display:none}
  .menu{flex-direction:row;gap:4px}
  .mi{width:auto;white-space:nowrap;padding:8px 12px}
  .side-note{display:none}
  .user span.un{display:none}
  .user{padding:3px}
}
@media (max-width:520px){.stat .num{font-size:28px}}
@media (prefers-reduced-motion:no-preference){.chip,.btn,.mi,.fc{transition:background-color .15s,filter .15s}}
</style>
</head>
<body>
<div class="app">
  <aside class="side gut">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4z"/><path d="M9 9h6M9 13h4"/></svg></div>
      <span class="bt">Sổ Tay<br>Tài Liệu</span>
    </div>
    <nav class="menu" id="menu" aria-label="Menu chính"></nav>
    <div class="side-note"><b>Mẹo</b>Gõ không dấu vào ô tìm kiếm cũng ra tài liệu.</div>
  </aside>

  <div class="main">
    <header class="top gut">
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" autocomplete="off" placeholder="Tìm tài liệu, nhãn, tên file" aria-label="Tìm tài liệu, nhãn hoặc tên file. Gõ không dấu cũng được">
      </div>
      <div class="top-r">
        <div class="bellwrap" id="bellwrap"></div>
        <div id="userbox"></div>
      </div>
    </header>
    <main class="content gut" id="view"></main>
    <footer class="foot gut" id="foot"></footer>
  </div>
</div>

<div id="modal" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
'use strict';
var LOAI=[{k:'Hướng dẫn',c:'new'},{k:'Biểu mẫu',c:'doing'},{k:'Quy trình',c:'wait'},{k:'Tài liệu',c:'ok'},{k:'Khác',c:'oth'}];
var WD=['Chủ Nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
function maxMB(){return state.remote?50:100}
var state={view:'tq',q:'',docs:[],ready:false,mem:false,remote:false,role:'local',err:'',fDoc:'all',bell:false,confirm:'',modal:null,busy:''};
var store=null,cache=null,vidUrl='',PW='';
var CHUNK=3*1024*1024+512*1024;
function canEdit(){return state.role!=='view'}

function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d')}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function today(){return ymd(new Date())}
function fmt(s){if(!s)return '—';var p=s.split('-');return p[2]+'/'+p[1]}
function lo(k){for(var i=0;i<LOAI.length;i++)if(LOAI[i].k===k)return LOAI[i];return LOAI[LOAI.length-1]}
function tags(s){return String(s||'').split(',').map(function(x){return x.trim()}).filter(Boolean)}
function newId(){return 'd'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function ico(n){
  var p={grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
    book:'<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4z"/><path d="M9 9h6M9 13h4"/>',
    bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 21h4"/>'}[n];
  return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>';
}

/* ---------- Chỗ lưu: trong chính máy này (IndexedDB) ---------- */
function idbStore(db){
  function run(name,mode,fn){return new Promise(function(res,rej){
    var t=db.transaction(name,mode),out=fn(t.objectStore(name));
    t.oncomplete=function(){res(out&&'result' in out?out.result:undefined)};
    t.onerror=t.onabort=function(){rej(t.error)};
  })}
  return {
    list:function(){return run('docs','readonly',function(s){return s.getAll()})},
    put:function(d){return run('docs','readwrite',function(s){return s.put(d)})},
    del:function(id){return run('docs','readwrite',function(s){return s.delete(id)})},
    putFile:function(id,blob){return run('files','readwrite',function(s){return s.put({id:id,blob:blob})})},
    getFile:function(id){return run('files','readonly',function(s){return s.get(id)}).then(function(r){return r?r.blob:null})},
    delFile:function(id){return run('files','readwrite',function(s){return s.delete(id)})},
    getMeta:function(k){return run('meta','readonly',function(s){return s.get(k)}).then(function(r){return r?r.v:null})},
    setMeta:function(k,v){return run('meta','readwrite',function(s){return s.put({k:k,v:v})})}
  };
}
function memStore(){
  var docs={},files={},meta={};
  return {
    list:function(){return Promise.resolve(Object.keys(docs).map(function(k){return docs[k]}))},
    put:function(d){docs[d.id]=d;return Promise.resolve()},
    del:function(id){delete docs[id];return Promise.resolve()},
    putFile:function(id,b){files[id]=b;return Promise.resolve()},
    getFile:function(id){return Promise.resolve(files[id]||null)},
    delFile:function(id){delete files[id];return Promise.resolve()},
    getMeta:function(k){return Promise.resolve(meta[k]||null)},
    setMeta:function(k,v){meta[k]=v;return Promise.resolve()}
  };
}
/* ---------- Chỗ lưu chung: Vercel (hàm /api + Blob) ---------- */
function getPw(){try{return localStorage.getItem('sotay-pw')||''}catch(e){return ''}}
function setPw(v){try{if(v)localStorage.setItem('sotay-pw',v);else localStorage.removeItem('sotay-pw')}catch(e){}}
function apiDocs(method,body){
  var opt={method:method,cache:'no-store',headers:{}};
  if(PW)opt.headers['x-admin-password']=PW;
  if(body){opt.headers['content-type']='application/json';opt.body=JSON.stringify(body)}
  return fetch('/api/docs',opt).then(function(r){
    return r.json().catch(function(){return {}}).then(function(j){
      if(!r.ok){var e=new Error(j.error||('http '+r.status));e.status=r.status;throw e}
      return j;
    });
  });
}
function sendChunk(key,i,piece,tries){
  return fetch('/api/upload?id='+encodeURIComponent(key)+'&n='+i,{method:'POST',headers:{'x-admin-password':PW,'content-type':'application/octet-stream'},body:piece})
    .then(function(r){if(!r.ok)throw new Error('upload '+r.status);return r.json()})
    .then(function(j){if(!j.url)throw new Error('no url');return j.url},function(err){if(tries>0)return sendChunk(key,i,piece,tries-1);throw err});
}
function remoteStore(){
  return {
    list:function(){return apiDocs('GET').then(function(j){return (j.docs||[]).map(function(x){x.hasFile=!!(x.parts&&x.parts.length);return x})})},
    put:function(d){var o=Object.assign({},d);delete o.hasFile;return apiDocs('POST',{op:'put',doc:o}).then(function(){})},
    del:function(id){return apiDocs('POST',{op:'del',id:id}).then(function(){})},
    putFile:function(key,blob,onProg){
      var id=String(key).split('/')[0],n=Math.max(1,Math.ceil(blob.size/CHUNK)),parts=[],i=0;
      function next(){
        if(i>=n)return Promise.resolve(parts);
        if(onProg)onProg(i+1,n);
        return sendChunk(id,i,blob.slice(i*CHUNK,Math.min(blob.size,(i+1)*CHUNK)),1).then(function(u){parts.push(u);i++;return next()});
      }
      return next();
    },
    getFile:function(key,d){
      var urls=(d&&d.parts)||[];
      if(!urls.length)return Promise.resolve(null);
      var out=[],i=0;
      function next(){
        if(i>=urls.length)return Promise.resolve(new Blob(out,{type:d.ftype||'application/octet-stream'}));
        return fetch(urls[i]).then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.blob()}).then(function(b){out.push(b);i++;return next()});
      }
      return next();
    },
    delFile:function(){return Promise.resolve()},
    getMeta:function(){return Promise.resolve(1)},
    setMeta:function(){return Promise.resolve()}
  };
}
function openStore(){

function imgToJpeg(file){
  return new Promise(function(res,rej){
    var u=URL.createObjectURL(file),im=new Image();
    im.onload=function(){
      var w=im.naturalWidth,h=im.naturalHeight,M=1800,k=Math.min(1,M/Math.max(w,h));
      var cw=Math.max(1,Math.round(w*k)),ch=Math.max(1,Math.round(h*k));
      var c=document.createElement('canvas');c.width=cw;c.height=ch;
      var g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cw,ch);g.drawImage(im,0,0,cw,ch);
      URL.revokeObjectURL(u);
      c.toBlob(function(b){
        if(!b)return rej(new Error('jpeg'));
        var fr=new FileReader();fr.onload=function(){res({w:cw,h:ch,bytes:new Uint8Array(fr.result)})};fr.onerror=rej;fr.readAsArrayBuffer(b);
      },'image/jpeg',0.85);
    };
    im.onerror=function(){URL.revokeObjectURL(u);rej(new Error('img'))};
    im.src=u;
  });
}
/* Viết file PDF: mỗi ảnh một trang A4 (xoay ngang nếu ảnh ngang) */
function buildPdf(pgs){
  var enc=new TextEncoder(),parts=[],len=0,offs=[],n=pgs.length;
  function add(x){var u=typeof x==='string'?enc.encode(x):x;parts.push(u);len+=u.length}
  function obj(i,body){offs[i]=len;add(i+' 0 obj\n'+body+'\nendobj\n')}
  function f2(v){return (Math.round(v*100)/100).toString()}
  add('%PDF-1.4\n');
  var kids=[];for(var i=0;i<n;i++)kids.push((3+3*i)+' 0 R');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+n+' >>');
  pgs.forEach(function(p,i){
    var land=p.w>p.h,W=land?842:595,H=land?595:842,m=20,s=Math.min((W-2*m)/p.w,(H-2*m)/p.h),dw=p.w*s,dh=p.h*s,x=(W-dw)/2,y=(H-dh)/2;
    var pg=3+3*i,ct=4+3*i,im=5+3*i;
    obj(pg,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources << /XObject << /Im0 '+im+' 0 R >> >> /Contents '+ct+' 0 R >>');
    var cs='q '+f2(dw)+' 0 0 '+f2(dh)+' '+f2(x)+' '+f2(y)+' cm /Im0 Do Q';
    obj(ct,'<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream');
    offs[im]=len;
    add(im+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+p.w+' /Height '+p.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+p.bytes.length+' >>\nstream\n');
    add(p.bytes);add('\nendstream\nendobj\n');
  });
  var N=2+3*n,xr=len;
  add('xref\n0 '+(N+1)+'\n0000000000 65535 f \n');
  for(var j=1;j<=N;j++)add(('0000000000'+offs[j]).slice(-10)+' 00000 n \n');
  add('trailer\n<< /Size '+(N+1)+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF');
  return new Blob(parts,{type:'application/pdf'});
}
function imagesToPdf(list){
  var out=[],chain=Promise.resolve();
  list.forEach(function(x){chain=chain.then(function(){return imgToJpeg(x.file)}).then(function(j){out.push(j)})});
  return chain.then(function(){return buildPdf(out)});
}

  var o=id?state.docs.filter(function(x){return x.id===id})[0]:null;
  if(id&&!o)return;
  state.modal={id:id||null};state.imgs=[];
  o=o||{loai:'Hướng dẫn'};
  var cur=o.hasFile?'<div class="cap">Đang có file: <b>'+esc(o.fname||'')+'</b></div><label style="display:flex;gap:8px;align-items:center;font-weight:400"><input type="checkbox" id="f-rm"> Bỏ file này</label>':'';
  var h='<h2 id="dlg-t">'+(id?'Sửa tài liệu':'Thêm tài liệu mới')+'</h2>'+
    field('f-ten','Tên tài liệu','<input class="inp" id="f-ten" value="'+esc(o.ten)+'" autocomplete="off">')+
    field('f-loai','Loại','<select class="inp" id="f-loai">'+LOAI.map(function(l){return '<option'+(l.k===o.loai?' selected':'')+'>'+esc(l.k)+'</option>'}).join('')+'</select>')+
    field('f-file','Tải file lên (PDF hoặc video)','<input class="inp" type="file" id="f-file" accept="application/pdf,video/*">'+cur,'Tối đa '+maxMB()+' MB mỗi file.')+
    field('f-img','Hoặc chọn ảnh để ghép thành 1 file PDF','<input class="inp" type="file" id="f-img" accept="image/*" multiple><div class="thumbs" id="f-thumbs"></div>','Chọn nhiều ảnh cùng lúc hoặc chọn thêm nhiều lần. File PDF sẽ lấy tên của tài liệu.')+
    field('f-link','Đường dẫn (nếu có)','<input class="inp" id="f-link" type="url" inputmode="url" value="'+esc(o.link)+'" placeholder="https://" autocomplete="off">','Dán link Google Drive hoặc trang hướng dẫn của công ty.')+
    field('f-nhan','Nhãn','<input class="inp" id="f-nhan" value="'+esc(o.nhan)+'" autocomplete="off">','Cách nhau bằng dấu phẩy. Ví dụ: máy POS, lắp đặt')+
    field('f-gc','Ghi chú','<textarea class="inp" id="f-gc">'+esc(o.ghichu)+'</textarea>');
  $('#modal').innerHTML='<div class="scrim" data-act="close"></div><form class="dlg" id="form" role="dialog" aria-modal="true" aria-labelledby="dlg-t" novalidate>'+h+'<div class="err" id="f-err" role="alert"></div><div class="dlg-foot"><button type="button" class="btn ghost" data-act="close">Hủy</button><button type="submit" class="btn" id="f-save">Lưu</button></div></form>';
  $('#modal').hidden=false;
  setTimeout(function(){var f=$('#f-ten');if(f)f.focus()},30);
}
function openLogin(){
  state.modal={login:true};
  $('#modal').innerHTML='<div class="scrim" data-act="close"></div><form class="dlg" id="login" role="dialog" aria-modal="true" aria-labelledby="dlg-t" novalidate><h2 id="dlg-t">Đăng nhập quản lý</h2>'+
    field('l-pass','Mật khẩu quản lý','<input class="inp" id="l-pass" type="password" autocomplete="current-password">')+
    '<div class="err" id="l-err" role="alert"></div><div class="dlg-foot"><button type="button" class="btn ghost" data-act="close">Hủy</button><button type="submit" class="btn" id="l-go">Đăng nhập</button></div></form>';
  $('#modal').hidden=false;
  setTimeout(function(){var f=$('#l-pass');if(f)f.focus()},30);
}
function closeModal(){
  (state.imgs||[]).forEach(function(x){try{URL.revokeObjectURL(x.url)}catch(e){}});state.imgs=[];
  state.modal=null;$('#modal').hidden=true;$('#modal').innerHTML='';
  if(vidUrl){URL.revokeObjectURL(vidUrl);vidUrl=''}
}
function val(id){var e=$('#'+id);return e?e.value.trim():''}
var toastT=0;
function toast(m,ms){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},ms||2400)}

/* ---------- Mở, tải, gửi Zalo ---------- */
function find(id){return state.docs.filter(function(x){return x.id===id})[0]}
function toFile(d,blob){return new File([blob],d.fname||'tai-lieu',{type:d.ftype||blob.type||'application/octet-stream'})}
function saveBlob(d,blob){
  var u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download=d.fname||'tai-lieu';document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(u)},4000);
}
function fileKey(d){return d.fpath||d.id}
function getBlob(d){return store.getFile(fileKey(d),d)}
function doShare(d,file){
  var data={files:[file],title:d.ten};
  if(!(navigator.canShare&&navigator.canShare(data))){
    saveBlob(d,file);
    toast('Máy này chưa mở được bảng chia sẻ. Đã tải file về, anh mở Zalo rồi đính kèm file vừa tải.',5000);
    return Promise.resolve();
  }
  return navigator.share(data).then(function(){},function(e){
    if(e&&e.name==='AbortError')return;
    if(e&&e.name==='NotAllowedError'){cache={id:d.id,file:file};state.busy='';refresh();toast('File đã sẵn sàng. Anh bấm Gửi Zalo thêm một lần nữa nhé.',4500);return}
    saveBlob(d,file);toast('Chưa mở được bảng chia sẻ. Đã tải file về, anh gửi bằng Zalo nhé.',5000);
  });
}
function shareDoc(id){
  var d=find(id);if(!d)return;
  if(!d.hasFile){
    if(!d.link)return;
    if(navigator.share){navigator.share({title:d.ten,text:d.ten,url:d.link}).catch(function(){})}
    else if(navigator.clipboard){navigator.clipboard.writeText(d.link).then(function(){toast('Đã sao chép link, anh dán vào Zalo nhé.')},function(){toast('Chưa sao chép được link.')})}
    return;
  }
  if(cache&&cache.id===id){var f=cache.file;cache=null;doShare(d,f);return}
  state.busy=id;refresh();
  getBlob(d).then(function(b){
    if(!b){state.busy='';refresh();toast('Không tìm thấy file. Anh thử tải lại file lên nhé.');return}
    var file=toFile(d,b);
    state.busy='';
    return doShare(d,file).then(function(){refresh()});
  },function(){state.busy='';refresh();toast('Chưa đọc được file.')});
}
function openDoc(id){
  var d=find(id);if(!d||!d.hasFile)return;
  getBlob(d).then(function(b){
    if(!b){toast('Không tìm thấy file.');return}
    if(isVideo(d)){
      vidUrl=URL.createObjectURL(b);state.modal={play:true};
      $('#modal').innerHTML='<div class="scrim" data-act="close"></div><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-t"><h2 id="dlg-t">'+esc(d.ten)+'</h2><video class="vid" controls playsinline preload="metadata" src="'+vidUrl+'"></video><div class="dlg-foot"><button type="button" class="btn ghost" data-act="close">Đóng</button></div></div>';
      $('#modal').hidden=false;
    }else{
      var u=URL.createObjectURL(b),a=document.createElement('a');
      a.href=u;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(u)},60000);
    }
  },function(){toast('Chưa đọc được file.')});
}
function saveDoc(id){
  var d=find(id);if(!d||!d.hasFile)return;
  getBlob(d).then(function(b){if(b){saveBlob(d,b);toast('Đã tải file về máy.')}else toast('Không tìm thấy file.')});
}

/* ---------- Sự kiện ---------- */
document.addEventListener('submit',function(e){
  if(e.target.id==='login'){
    e.preventDefault();
    var pw=($('#l-pass')||{}).value||'';
    if(!pw){$('#l-err').textContent='Anh nhập mật khẩu nhé.';return}
    var go=$('#l-go');go.disabled=true;go.textContent='Đang vào…';
    PW=pw;
    apiDocs('POST',{op:'login'}).then(function(){
      setPw(pw);state.role='admin';closeModal();toast('Đã đăng nhập');refresh();
    },function(err){
      PW='';go.disabled=false;go.textContent='Đăng nhập';
      $('#l-err').textContent=(err&&err.status===401)?'Sai mật khẩu. Anh thử lại nhé.':'Chưa đăng nhập được. Anh kiểm tra mạng rồi thử lại nhé.';
    });
    return;
  }
  if(e.target.id!=='form')return;
  e.preventDefault();
  var m=state.modal;if(!m||!store)return;
  var old=m.id?find(m.id):null;
  if(!val('f-ten')){$('#f-err').textContent='Anh nhập tên tài liệu nhé.';$('#f-ten').focus();return}
  var link=val('f-link');
  if(link&&!/^https?:\/\//i.test(link)){$('#f-err').textContent='Đường dẫn cần bắt đầu bằng http:// hoặc https://';$('#f-link').focus();return}
  var fi=$('#f-file'),file=(fi&&fi.files&&fi.files[0])||null;
  if(file){
    var okT=file.type==='application/pdf'||file.type.indexOf('video/')===0||/\.(pdf|mp4|mov|m4v|webm)$/i.test(file.name);
    if(!okT){$('#f-err').textContent='Chỉ tải được file PDF hoặc video.';return}
    if(file.size>maxMB()*1024*1024){$('#f-err').textContent='File lớn hơn '+maxMB()+' MB nên chưa tải được. Anh để file ở Google Drive rồi dán link nhé.';return}
  }
  var imgs=state.imgs||[];
  if(file&&imgs.length){$('#f-err').textContent='Anh chọn file hoặc chọn ảnh thôi, đừng chọn cả hai nhé.';return}
  function finish(file){
  var rm=!!($('#f-rm')&&$('#f-rm').checked);
  var o={id:old?old.id:newId(),ten:val('f-ten'),loai:val('f-loai'),link:link,nhan:val('f-nhan'),ghichu:val('f-gc'),ngay:today()};
  if(old){
    if(old.hasFile&&!file&&!rm){o.hasFile=true;o.fname=old.fname;o.ftype=old.ftype;o.fsize=old.fsize;if(old.fpath)o.fpath=old.fpath;if(old.parts)o.parts=old.parts}
  }
  var oldKey=(old&&old.hasFile)?fileKey(old):'';
  var btn=$('#f-save');btn.disabled=true;btn.textContent=file?'Đang lưu file…':'Đang lưu…';
  var p=Promise.resolve();
  if(file){
    var ft=file.type||(/\.pdf$/i.test(file.name)?'application/pdf':'video/mp4');
    var ext=(file.name.match(/\.([A-Za-z0-9]{1,5})$/)||[])[1]||'bin';
    o.hasFile=true;o.fname=file.name;o.ftype=ft;o.fsize=file.size;o.fpath=o.id+'/'+Date.now().toString(36)+'.'+ext.toLowerCase();
    p=store.putFile(o.fpath,file,function(i,n){if(n>1)btn.textContent='Đang tải lên '+i+'/'+n+'…'}).then(function(parts){if(parts)o.parts=parts});
  }else if(old&&old.hasFile&&rm){p=store.delFile(oldKey)}
  p.then(function(){return store.put(o)}).then(function(){
    if(file&&oldKey)Promise.resolve(store.delFile(oldKey)).catch(function(){});
    if(cache&&cache.id===o.id)cache=null;
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(x){}
    closeModal();toast('Đã lưu');return reload();
  }).catch(function(){btn.disabled=false;btn.textContent='Lưu';$('#f-err').textContent=state.remote?'Chưa lưu được. Anh bấm Đăng xuất, đăng nhập quản lý lại rồi thử nhé.':'Chưa lưu được. Máy có thể đã hết chỗ trống, anh thử file nhỏ hơn nhé.'});
  }
  if(imgs.length){
    var b0=$('#f-save');b0.disabled=true;b0.textContent='Đang ghép ảnh…';$('#f-err').textContent='';
    imagesToPdf(imgs).then(function(blob){
      if(blob.size>maxMB()*1024*1024){b0.disabled=false;b0.textContent='Lưu';$('#f-err').textContent='Các ảnh ghép lại lớn hơn '+maxMB()+' MB. Anh bớt ảnh rồi thử lại nhé.';return}
      var nm=pdfName(val('f-ten'));
      var f;try{f=new File([blob],nm,{type:'application/pdf'})}catch(x){f=blob;f.name=nm}
      finish(f);
    },function(){b0.disabled=false;b0.textContent='Lưu';$('#f-err').textContent='Có ảnh không đọc được. Anh bỏ ảnh đó hoặc chọn ảnh khác nhé.'});
  }else finish(file);
});
$('#q').addEventListener('input',function(e){state.q=e.target.value;renderView()});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){if(state.modal)closeModal();else if(state.bell){state.bell=false;renderNav()}}
});
var confT=0;
document.addEventListener('click',function(e){
  if(state.bell&&!e.target.closest('.bellwrap')){state.bell=false;renderNav()}
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.getAttribute('data-act'),id=el.getAttribute('data-id');
  if(a==='nav'){state.view=el.getAttribute('data-v');refresh();window.scrollTo(0,0)}
  else if(a==='login')openLogin();
  else if(a==='logout'){setPw('');PW='';state.role='view';refresh();toast('Đã đăng xuất')}
  else if(a==='add'){if(canEdit())openForm(null)}
  else if(a==='edit')openForm(id);
  else if(a==='imgup'||a==='imgdn'||a==='imgrm'){
    var ix=+el.getAttribute('data-i'),L=state.imgs||[];
    if(a==='imgrm'){var r=L.splice(ix,1)[0];if(r)URL.revokeObjectURL(r.url)}
    else{var j=a==='imgup'?ix-1:ix+1;if(j>=0&&j<L.length){var t=L[ix];L[ix]=L[j];L[j]=t}}
    drawThumbs();
  }
  else if(a==='close')closeModal();
  else if(a==='fdoc'){state.fDoc=el.getAttribute('data-v');renderView()}
  else if(a==='tag'){state.q=el.getAttribute('data-v');$('#q').value=state.q;renderView()}
  else if(a==='open')openDoc(id);
  else if(a==='save')saveDoc(id);
  else if(a==='share')shareDoc(id);
  else if(a==='bell'){state.bell=!state.bell;renderNav()}
  else if(a==='bellgo'){state.bell=false;state.view='tl';state.fDoc='all';refresh()}
  else if(a==='del'){
    if(state.confirm!==id){state.confirm=id;renderView();clearTimeout(confT);confT=setTimeout(function(){state.confirm='';renderView()},3500)}
    else{
      state.confirm='';clearTimeout(confT);
      var d=find(id);
      store.del(id).then(function(){return d&&d.hasFile?Promise.resolve(store.delFile(fileKey(d))).catch(function(){}):null}).then(function(){if(cache&&cache.id===id)cache=null;toast('Đã xóa');return reload()},function(){toast('Chưa xóa được. Anh đăng nhập quản lý lại nhé.')});
    }
  }
  else if(a==='clear-ex'){
    var items=state.docs.filter(function(o){return o.vidu});
    Promise.all(items.map(function(o){return store.del(o.id).then(function(){return o.hasFile?Promise.resolve(store.delFile(fileKey(o))).catch(function(){}):null})})).then(function(){toast('Đã xóa các tài liệu ví dụ');return reload()});
  }
});

/* ---------- Khởi động ---------- */
if(location.hash==='#tailieu')state.view='tl';
function startRemote(){
  return fetch('/api/docs',{cache:'no-store'}).then(function(r){
    if(r.status===503||r.status===404||r.status===405)return false;
    state.remote=true;state.role='view';store=remoteStore();PW=getPw();
    var chk=PW?apiDocs('POST',{op:'login'}).then(function(){state.role='admin'},function(err){if(err&&err.status===401){setPw('');PW=''}}):Promise.resolve();
    return chk.then(function(){return reload()}).then(function(){return true});
  },function(){
    if(location.protocol==='file:')return false;
    state.remote=true;state.role='view';store=remoteStore();state.ready=true;
    state.err='Chưa nối được chỗ lưu chung. Anh kiểm tra mạng rồi tải lại trang nhé.';refresh();return true;
  });
}
refresh();
startRemote().then(function(isRemote){
  if(isRemote){
    document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&store&&state.ready&&!state.modal)reload()});
    return;
  }
  return openStore().then(function(s){
    if(!s){state.mem=true;s=memStore()}
    store=s;
    return store.list().then(function(l){
      if(!l.length)return store.getMeta('seeded').then(function(v){return v?null:seed()});
    });
  }).then(reload,function(){state.mem=true;store=memStore();state.ready=true;refresh()});
});
})();
</script>
